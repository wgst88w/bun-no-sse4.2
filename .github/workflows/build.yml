name: Build Bun (core2, no SSE4.2)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space (aggressive)
        run: |
          # ubuntu-latest: 4-core, 16GB RAM, 14GB SSD. WebKit+Bun needs ~14GB.
          # Reclaim everything we don't need; add swap for the link step.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache
          sudo apt-get clean
          sudo apt-get autoremove -y
          (sudo swapoff /swapfile 2>/dev/null; sudo rm -f /swapfile 2>/dev/null; true)
          (sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null; sudo chmod 600 /swapfile 2>/dev/null; sudo mkswap /swapfile 2>/dev/null; sudo swapon /swapfile 2>/dev/null; true)
          df -h /
          free -h

      - name: Install clang-23, ninja, deps
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23 noble
          sudo apt-get install -y --no-install-recommends \
            clang-23 lld-23 llvm-23-dev ninja-build cmake nasm \
            libssl-dev liblz4-dev libzstd-dev libicu-dev \
            g++-14 libstdc++-14-dev
          # symlink clang-23 to front
          sudo ln -sf /usr/bin/clang-23 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          clang --version | head -1
          # enable 2-core ninja parallelism to fit RAM
          echo "nproc=$(nproc)"

      - name: Install Rust nightly (pinned by bun)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain nightly-2026-05-06 --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools \
            --target x86_64-unknown-linux-gnu
          source $HOME/.cargo/env
          rustc --version

      - name: Install bootstrap Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - name: Clone bun source
        run: |
          git clone --depth 1 https://github.com/oven-sh/bun.git /tmp/bun
          cd /tmp/bun
          git rev-parse --short HEAD

      - name: Apply core2 patches
        run: |
          cd /tmp/bun
          # Patch 1: C/C++ codegen target. flags.ts: -march=nehalem -> core2
          sed -i 's/"-march=nehalem"/"-march=core2"/' scripts/build/flags.ts
          # Patch 2: Rust crates target-cpu. rust.ts: "nehalem" -> "core2"
          sed -i 's/? "nehalem"/? "core2"/' scripts/build/rust.ts
          echo "=== verify patches ==="
          grep -n "core2" scripts/build/flags.ts scripts/build/rust.ts
          # libspng: use SSE2 instead of SSE4.1 for Core 2 / Penryn CPUs

      - name: Clone WebKit (local build, inherits -march=core2)
        run: |
          # Bun's WEBKIT_VERSION pins a commit; clone the fork and fetch it.
          git clone --filter=blob:none --no-checkout https://github.com/oven-sh/WebKit.git /tmp/WebKit
          cd /tmp/WebKit
          # WebKit version pinned in bun's scripts/build/deps/webkit.ts
          WK_SHA=$(grep -oE 'WEBKIT_VERSION = "[0-9a-f]{40}"' /tmp/bun/scripts/build/deps/webkit.ts | grep -oE '[0-9a-f]{40}')
          echo "WebKit pinned SHA: $WK_SHA"
          git fetch --depth 1 origin "$WK_SHA"
          git checkout FETCH_HEAD
          git log --oneline -1

      - name: Inspect libspng SSE configuration
        run: |
          cd /tmp/bun
          echo "=== libspng SSE definitions ==="
          grep -R -n -E 'SPNG_SSE|_mm_blendv_epi8' vendor/libspng 2>/dev/null | head -100 || true
          echo "=== libspng build configuration ==="
          grep -R -n -E 'SPNG_SSE|libspng' scripts/build vendor/libspng/CMakeLists.txt vendor/libspng/meson.build 2>/dev/null | head -100 || true

      - name: Configure (release, baseline=core2, local WebKit)
        run: |
          cd /tmp/bun
          source $HOME/.cargo/env
          export PATH="/usr/lib/llvm-23/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-06
          export CC=/usr/lib/llvm-23/bin/clang
          export CXX=/usr/lib/llvm-23/bin/clang++
          export BUN_WEBKIT_PATH=/tmp/WebKit
          bun scripts/build.ts --profile=release --baseline=true --webkit=local --configure-only --cacheDir=/tmp/bc
          echo "=== verify march in build.ninja ==="
          grep -m2 "march=core2" build/release/build.ninja
          grep -m2 "target-cpu=core2" build/release/build.ninja || true
          # Force libspng to use SSE2 rather than SSE4.1.
          echo "=== verify libspng SSE setting ==="

      - name: Build
        run: |
          cd /tmp/bun
          source $HOME/.cargo/env
          export PATH="/usr/lib/llvm-23/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-06
          export CC=/usr/lib/llvm-23/bin/clang
          export CXX=/usr/lib/llvm-23/bin/clang++
          export BUN_WEBKIT_PATH=/tmp/WebKit
          ninja -C build/release bun-profile
          ls -lh build/release/bun-profile

      - name: Strip, bundle ICU 74 libs, wrapper, verify
        run: |
          set -e
          mkdir -p /tmp/bun-dist/lib
          cp /tmp/bun/build/release/bun-profile /tmp/bun-dist/bun-core2
          strip /tmp/bun-dist/bun-core2 || true
          # Bun's local-WebKit links system ICU (Ubuntu 24.04 = ICU 74) dynamically.
          # Bundle the runner's ICU 74 libs + a wrapper that sets LD_LIBRARY_PATH.
          # (patchelf --set-rpath segfaults Bun's binary at runtime — Bun appends
          # data past the ELF that patchelf corrupts. LD_LIBRARY_PATH avoids touching it.)
          cp -L /usr/lib/x86_64-linux-gnu/libicui18n.so.74 /tmp/bun-dist/lib/
          cp -L /usr/lib/x86_64-linux-gnu/libicuuc.so.74   /tmp/bun-dist/lib/
          cp -L /usr/lib/x86_64-linux-gnu/libicudata.so.74 /tmp/bun-dist/lib/
          printf '%s\n' '#!/bin/sh' \
            'DIR=$(cd "$(dirname "$0")" && pwd)' \
            'export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$DIR/bun-core2" "$@"' > /tmp/bun-dist/bun
          chmod +x /tmp/bun-dist/bun
          # sanity test via wrapper (sets LD_LIBRARY_PATH internally)
          cd /tmp/bun-dist
          ./bun --version
          ./bun -e "console.log(42)"

      - name: Upload binary + ICU libs
        uses: actions/upload-artifact@v4
        with:
          name: bun-core2
          path: /tmp/bun-dist/
          retention-days: 30
          compression-level: 0
